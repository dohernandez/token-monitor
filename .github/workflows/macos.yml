name: macOS build and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR checks can stop. Each main commit keeps its own release run.
concurrency:
  group: macos-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Commit signatures
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Task (checksum-verified bootstrap)
        run: python3 taskfiles/provision/scripts/install_task.py --dir "$RUNNER_TEMP/bin" --github-path
      - name: Require GitHub-verified commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: task common:check:commit-signatures -- --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --pr "$PR_NUMBER"

  # Like genlayer-node's Lint job: CI calls the same tasks the git hooks call.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Task (checksum-verified bootstrap)
        run: python3 taskfiles/provision/scripts/install_task.py --dir "$RUNNER_TEMP/bin" --github-path
      - name: Install pinned ruff
        run: task provision:install-ruff
      - name: Lint Python
        run: task common:lint
      - name: Check tasks pass CLI arguments
        run: task common:check:task-cli-args
      # API-made commits skip the local commit-msg hook, so CI checks every new
      # commit message (and the PR description) with the same script.
      - name: Reject AI attribution in commit messages and PR description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: task common:check:pr-messages -- --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --pr "$PR_NUMBER"

  build:
    name: Test and build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Task (checksum-verified bootstrap)
        run: python3 taskfiles/provision/scripts/install_task.py --dir "$RUNNER_TEMP/bin" --github-path
      - name: Validate release logic
        run: task common:test:release -- -v
      - name: Build app
        env:
          APP_BUILD: ${{ github.run_number }}
        run: task build:app -- --build-dir "$RUNNER_TEMP/build" --expect-arch "${{ matrix.arch }}"
      - name: Build test app
        run: task build:app -- --test --build-dir "$RUNNER_TEMP/test-build" --expect-arch "${{ matrix.arch }}"
      - name: Verify update signatures and tamper rejection
        env:
          SPARKLE_TOOLS: ${{ runner.temp }}/build/sparkle
        run: task build:check:signatures
      - name: Run native self-tests
        run: task build:check -- --test-build "$RUNNER_TEMP/test-build/Token Monitor.app"
      - name: Check isolated updater startup
        run: task build:check:updater -- "$RUNNER_TEMP/test-build/Token Monitor.app"
      - name: Check packaged app
        run: task build:check -- "$RUNNER_TEMP/build/Token Monitor.app"
      - name: Test accounting with bundled Python
        run: task common:test:unit PYTHON="$RUNNER_TEMP/build/Token Monitor.app/Contents/Resources/python/bin/python3" -- -v

      - name: Verify PR installer
        if: github.event_name == 'pull_request'
        run: task release:package -- --app "$RUNNER_TEMP/build/Token Monitor.app" --version "$(cat VERSION)" --output "$RUNNER_TEMP/pr-installer"
      - name: Archive tested app
        run: task release:archive -- "$RUNNER_TEMP/build/Token Monitor.app" "$RUNNER_TEMP/app.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-${{ matrix.arch }}
          path: ${{ runner.temp }}/app.zip
          if-no-files-found: error
          retention-days: 7

  version:
    name: Reserve release version
    needs: [build, policy, lint]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned Task (checksum-verified bootstrap)
        run: python3 taskfiles/provision/scripts/install_task.py --dir "$RUNNER_TEMP/bin" --github-path
      - name: Read merged PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: task release:version:branch -- --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"
      - name: Reserve or reuse tested commit tag
        id: version
        run: task release:version

  package:
    name: Release installers
    needs: [build, version]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-${{ matrix.arch }}
          path: ${{ runner.temp }}/download
      - name: Install pinned Task (checksum-verified bootstrap)
        run: python3 taskfiles/provision/scripts/install_task.py --dir "$RUNNER_TEMP/bin" --github-path
      - name: Unpack tested app
        run: task release:unpack -- "$RUNNER_TEMP/download/app.zip" "$RUNNER_TEMP/unpacked"
      - name: Create and verify installer
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          APP_BUILD: ${{ github.run_number }}
        run: task release:package -- --app "$RUNNER_TEMP/unpacked/Token Monitor.app" --version "$RELEASE_VERSION" --build "$APP_BUILD"
      - name: Prepare pinned signing tools
        run: task release:tools -- --dir "$RUNNER_TEMP/signing"
      - name: Sign installer and update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          APP_BUILD: ${{ github.run_number }}
        run: task release:sign -- --image "dist/Token-Monitor-$RELEASE_VERSION-macOS-${{ matrix.arch }}.dmg" --version "$RELEASE_VERSION" --build "$APP_BUILD" --arch "${{ matrix.arch }}" --tools "$RUNNER_TEMP/signing/sparkle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete release
    needs: [version, package]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - name: Install pinned Task (checksum-verified bootstrap)
        run: python3 taskfiles/provision/scripts/install_task.py --dir "$RUNNER_TEMP/bin" --github-path
      - name: Prepare public signature verifier
        run: task release:tools -- --dir "$RUNNER_TEMP" --verifier-only
      - name: Publish verified installers and signed feeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          UPDATE_VERIFIER: ${{ runner.temp }}/key_public
        run: task release:publish
